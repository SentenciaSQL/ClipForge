<section class="wizard avc-panel">
  <header class="wizard__header">
    <div>
      <div class="avc-label">Clip generation</div>
      <h2 class="wizard__title">Configure before AI analysis</h2>
      <p class="wizard__lead">
        Import does not start processing. Review metadata, set options, then click Generate Clips.
      </p>
    </div>
  </header>

  <div *ngIf="error()" class="banner banner--error">{{ error() }}</div>
  <div *ngIf="message()" class="banner banner--ok">{{ message() }}</div>

  <ng-container *ngIf="step === 'configure'; else summaryStep">
    <div class="wizard__profiles">
      <label>
        <span class="avc-label">Generation profile</span>
        <select
          class="avc-input mt-2"
          [ngModel]="selectedProfileId"
          (ngModelChange)="applyProfile($event)"
        >
          <option value="">Custom / none</option>
          <option *ngFor="let profile of profiles()" [value]="profile.id">
            {{ profile.name }}{{ profile.is_builtin ? '' : ' (custom)' }}
          </option>
        </select>
      </label>
      <div class="wizard__profile-actions">
        <input
          class="avc-input"
          [(ngModel)]="newProfileName"
          placeholder="Save current as custom profile"
        />
        <button type="button" class="avc-btn-ghost" (click)="saveAsProfile()">Save profile</button>
      </div>
      <div class="wizard__profile-list" *ngIf="profiles().length">
        <div class="profile-row" *ngFor="let profile of profiles()">
          <div>
            <strong>{{ profile.name }}</strong>
            <div class="text-muted text-xs">{{ profile.description || profile.slug }}</div>
          </div>
          <div class="profile-row__actions">
            <button type="button" class="avc-btn-ghost" (click)="applyProfile(profile.id)">Use</button>
            <button type="button" class="avc-btn-ghost" (click)="duplicateProfile(profile)">Duplicate</button>
            <button
              type="button"
              class="avc-btn-ghost"
              *ngIf="!profile.is_builtin"
              (click)="deleteProfile(profile)"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('duration')">
      <button type="button" class="section__header" (click)="toggle('duration', $event)">
        <span>A. Clip duration</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('duration') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('duration')">
        <app-clip-duration-settings
          [config]="config().duration"
          [videoDuration]="video.duration_seconds"
          (configChange)="patchConfig({ duration: $event })"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('subtitles')">
      <button type="button" class="section__header" (click)="toggle('subtitles', $event)">
        <span>B. Subtitle configuration</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('subtitles') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('subtitles')">
        <app-subtitle-settings
          [config]="config().subtitles"
          [presets]="subtitlePresets()"
          (configChange)="patchConfig({ subtitles: $event })"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('quality')">
      <button type="button" class="section__header" (click)="toggle('quality', $event)">
        <span>Quality &amp; adaptive rendering</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('quality') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('quality')">
        <app-quality-settings
          [config]="config().video"
          [sourceQuality]="sourceQuality()"
          [warnings]="warnings()"
          (configChange)="patchConfig({ video: $event }); refreshSourceQuality()"
          (applyAdaptive)="applyAdaptiveRecommendation()"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('format')">
      <button type="button" class="section__header" (click)="toggle('format', $event)">
        <span>C–D. Video frame, resolution &amp; FPS</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('format') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('format')">
        <app-video-format-settings
          [config]="config().video"
          [sourceWidth]="video.width"
          [sourceHeight]="video.height"
          (configChange)="patchConfig({ video: $event }); refreshSourceQuality()"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('reframe')">
      <button type="button" class="section__header" (click)="toggle('reframe', $event)">
        <span>E. Reframing mode</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('reframe') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('reframe')">
        <app-reframing-settings
          [config]="config().reframe"
          (configChange)="patchConfig({ reframe: $event })"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('ai')">
      <button type="button" class="section__header" (click)="toggle('ai', $event)">
        <span>F. AI analysis</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('ai') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('ai')">
        <app-ai-analysis-settings
          [config]="config().analysis"
          (configChange)="patchConfig({ analysis: $event })"
        />
      </div>
    </div>

    <div class="section" [class.section--open]="isOpen('audio')">
      <button type="button" class="section__header" (click)="toggle('audio', $event)">
        <span>G. Audio configuration</span>
        <span class="section__chevron" aria-hidden="true">{{ isOpen('audio') ? '▾' : '▸' }}</span>
      </button>
      <div class="section__body" *ngIf="isOpen('audio')">
        <app-audio-generation-settings
          [config]="config().audio"
          (configChange)="patchConfig({ audio: $event })"
        />
      </div>
    </div>

    <div class="wizard__footer">
      <button type="button" class="avc-btn-ghost" (click)="saveConfiguration()" [disabled]="busy">
        Save configuration
      </button>
      <button type="button" class="avc-btn-primary" (click)="goToSummary()" [disabled]="busy">
        Review &amp; continue
      </button>
    </div>
  </ng-container>

  <ng-template #summaryStep>
    <app-generation-configuration-summary
      [summary]="summary()"
      [warnings]="warnings()"
      [errors]="errors()"
      [busy]="busy"
      (back)="backToConfigure()"
      (generate)="confirmGenerate()"
    />
  </ng-template>
</section>
